<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="800" height="6" role="img" aria-label="divider">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#e0509f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#e0509f" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a45bd6" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#ff7a6b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e0509f" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="2" width="800" height="2" rx="1" fill="url(#shimmer)" filter="url(#glow)"/>
</svg>
